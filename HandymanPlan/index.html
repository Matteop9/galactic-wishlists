<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HandymanPlan — Europe Reno Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔨</text></svg>">
<style>
  :root{
    --bg:#f6f1e7; --panel:#fffdf7; --panel2:#f1ead9; --ink:#2b2620; --muted:#8a8072;
    --line:#e3dac6; --accent:#c1502e; --accent-soft:#f5ddd2; --olive:#6b7f3f; --olive-soft:#e7ecd8;
    --amber:#d9962e; --amber-soft:#f7ead0; --teal:#2e7f74; --teal-soft:#d9ece9;
    --red:#b03a2e; --red-soft:#f3dbd8; --green:#3e7d46; --green-soft:#dcebde;
    --blue:#3f6a8a; --blue-soft:#dde8ef; --purple:#7a5686; --purple-soft:#eadfee;
    --grey:#7d776c; --grey-soft:#e9e4d8;
    --radius:12px; --shadow:0 1px 3px rgba(60,45,20,.08),0 4px 14px rgba(60,45,20,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Nunito',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;overflow-wrap:anywhere}
  ::selection{background:var(--accent-soft)}
  a{color:var(--accent)}
  button{font-family:inherit}

  header{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .head-inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:900;font-size:19px;letter-spacing:-.3px;white-space:nowrap;cursor:pointer}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{border:none;background:transparent;padding:7px 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
  nav button:hover{color:var(--ink);background:var(--panel2)}
  nav button.on{background:var(--ink);color:var(--bg)}

  main{max-width:1100px;margin:0 auto;padding:22px 16px 90px}
  h1{font-size:24px;font-weight:900;letter-spacing:-.4px;margin-bottom:4px}
  h2{font-size:17px;font-weight:800;margin:26px 0 10px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:18px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .stat .v{font-size:22px;font-weight:900;margin-top:2px}
  .stat .d{font-size:12px;color:var(--muted)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .panel h3{font-size:15px;font-weight:800;margin-bottom:10px}

  .prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .prop-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px}
  .prop-card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .prop-card .name{font-weight:800;font-size:16px}
  .prop-card .loc{color:var(--muted);font-size:13px}

  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800}
  .bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--olive);transition:.3s}
  .bar i.over{background:var(--red)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .grow{flex:1}
  .right{margin-left:auto}
  .small{font-size:12.5px;color:var(--muted)}
  .money{font-variant-numeric:tabular-nums;font-weight:800}
  .pos{color:var(--green)} .neg{color:var(--red)} .mid{color:var(--amber)}

  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:800;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(60,45,20,.06)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.danger{color:var(--red)}
  .btn.danger:hover{border-color:var(--red)}
  .btn.tiny{padding:2px 9px;font-size:12px;border-radius:7px}
  .iconbtn{border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--muted);padding:9px 10px;margin:-7px -5px;border-radius:6px}
  .iconbtn:hover{background:var(--panel2);color:var(--ink)}

  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  .tablewrap{overflow-x:auto}

  .subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0}
  .subtabs button{border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
  .subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .task{display:flex;align-items:flex-start;gap:9px;padding:7px 6px;border-radius:8px}
  .task:hover{background:var(--panel2)}
  .task .tstat{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:var(--panel);margin-top:2px;position:relative;z-index:1}
  .task .tstat::before{content:'';position:absolute;inset:-10px}
  .task .tstat.doing{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
  .task .tstat.done{border-color:var(--green);background:var(--green);color:#fff}
  .task.done .ttl{text-decoration:line-through;color:var(--muted)}
  .task .meta{font-size:12px;color:var(--muted)}
  .tag{display:inline-block;background:var(--panel2);border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:700;color:var(--grey)}
  .tag.diy{background:var(--olive-soft);color:var(--olive)}

  .skill-row{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line)}
  .skill-row:last-child{border-bottom:none}
  .skill-row .dots{display:flex;gap:6px;flex-shrink:0;margin-top:3px}
  .sdot{width:26px;height:26px;border-radius:999px;border:2px solid var(--line);cursor:pointer;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--muted);transition:.12s}
  .sdot.s1{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
  .sdot.s2{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .sdot.s3{border-color:var(--green);background:var(--green);color:#fff}
  .skill-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
  .skill-links a{font-size:12.5px;font-weight:700;text-decoration:none;background:var(--accent-soft);padding:1px 9px;border-radius:99px}
  .skill-links a:hover{text-decoration:underline}

  .phasehead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
  .phasehead h2{margin:0}
  .phasehead .bar{width:130px}

  .alert{background:var(--amber-soft);border:1px solid #ecd3a3;border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:600;margin-bottom:8px}
  .alert.red{background:var(--red-soft);border-color:#e0b5af}
  .alert.green{background:var(--green-soft);border-color:#bcd8c0}

  .empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:14px}
  .empty .big{font-size:36px;margin-bottom:8px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
  .modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:480px;padding:20px}
  .modal h3{font-size:17px;font-weight:900;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .field textarea{min-height:74px;resize:vertical}
  .field .hint{font-size:12px;color:var(--muted);margin-top:3px}
  .fields-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

  .stars span{cursor:pointer;font-size:15px;color:#d8cfba;display:inline-block;padding:8px 5px;margin:-8px -1px}
  .stars span.on{color:var(--amber)}
  .journal-entry{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:12px}
  .journal-entry .jd{font-size:12px;font-weight:800;color:var(--muted)}
  .doc-row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .doc-row:last-child{border-bottom:none}
  .doc-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--olive);cursor:pointer;flex-shrink:0}
  .doc-row .dtl{cursor:pointer}
  .doc-row.done .dtl{text-decoration:line-through;color:var(--muted)}

  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 14px}
  .legend b{font-weight:800}

  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:800;font-size:13.5px;cursor:pointer;border:none;background:none;padding:0;margin-bottom:10px}
  .backlink:hover{color:var(--accent)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
  .kv .k{color:var(--muted);font-weight:700}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  @media(max-width:640px){
    .fields-2{grid-template-columns:1fr}
    main{padding:16px 10px 80px}
    .head-inner{padding:8px 10px}
    nav button{padding:6px 10px;font-size:13px}
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="logo" onclick="go('dashboard')">Handyman<span>Plan</span> 🔨</div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<footer>HandymanPlan — buy it, fix it, sell it, drive on. Data lives in this browser (export backups from the Data tab).</footer>
<div id="modal-root"></div>

<script>
/* ============================================================
   HandymanPlan — end-to-end Europe renovation journey tracker
   Single file, no dependencies. localStorage key: hmp_data_v1
   ============================================================ */

// ---------- constants ----------
const LS_KEY = 'hmp_data_v1';

const STAGES = [
  {id:'scouting',   label:'Scouting',    c:'grey'},
  {id:'viewing',    label:'Viewing',     c:'blue'},
  {id:'offer',      label:'Offer made',  c:'purple'},
  {id:'buying',     label:'Buying',      c:'amber'},
  {id:'renovating', label:'Renovating',  c:'accent'},
  {id:'selling',    label:'Selling',     c:'teal'},
  {id:'sold',       label:'Sold',        c:'green'},
  {id:'dropped',    label:'Dropped',     c:'red'},
];
const STAGE_COLORS = {grey:['var(--grey-soft)','var(--grey)'],blue:['var(--blue-soft)','var(--blue)'],purple:['var(--purple-soft)','var(--purple)'],amber:['var(--amber-soft)','var(--amber)'],accent:['var(--accent-soft)','var(--accent)'],teal:['var(--teal-soft)','var(--teal)'],green:['var(--green-soft)','var(--green)'],red:['var(--red-soft)','var(--red)']};

// Country presets: default % costs are editable per-property. Rough planning
// figures for cheap resale property — always verify locally before an offer.
const COUNTRIES = [
  {name:'Italy',    flag:'🇮🇹', buyPct:10, sellPct:5,  schengen:true,  taxId:'Codice fiscale',
   note:'Registration tax is charged on the CADASTRAL value (prezzo-valore) — often way below price on cheap houses — but notary has a ~€2–3k floor and the BUYER also pays agent ~3%+VAT. CGT: 26% on net gain if sold within 5 yrs (documented reno invoices deduct — no cash-in-hand!); EXEMPT after 5 yrs or as registered main residence. Permits must be filed by a geometra (€1–3k per project). Deal-killer: house must match its cadastral plans to sell — make conformity a purchase condition.'},
  {name:'Spain',    flag:'🇪🇸', buyPct:11, sellPct:8,  schengen:true,  taxId:'NIE',
   note:'ITP 6–11% by region, charged on the official "valor de referencia" if HIGHER than your price — check it before offering on any cheap ruin. Seller pays agent. Selling as non-resident: 3% of price withheld + plusvalía municipal. CGT 19% non-resident (documented works deduct). Beware illegal rural builds: an AFO-certificate property cannot be extended or substantially renovated.'},
  {name:'Portugal', flag:'🇵🇹', buyPct:10, sellPct:7,  schengen:true,  taxId:'NIF',
   note:'From 1 Sept 2026 NON-RESIDENTS pay a flat 7.5% IMT (+0.8% stamp) — refundable if you become tax resident within 2 yrs of buying. Residents pay near-zero IMT at this price level, so residency-first flips the maths. Agent (seller pays) ~5%+VAT. CGT: only 50% of gain taxed at scale rates; works invoices with your NIF from last 12 yrs deduct. Caderneta, registry and reality must all match. D7 visa is Europe’s easiest (~€920/mo passive income).'},
  {name:'France',   flag:'🇫🇷', buyPct:10, sellPct:6,  schengen:true,  taxId:'Numéro fiscal',
   note:'Notaire ~7.5–9%, but fixed minimums bite cheap houses (12–15% all-in on a €20k ruin). CGT 19% + 17.2% social (36.2%) for non-residents, tapering from year 6 (income-tax part exempt at 22 yrs); after 5 yrs held you may add a flat 15% for renovations with NO invoices — the DIYer’s friend. DIY electrics legal but Consuel certificate needed to get connected. Failed septic must be fixed within 1 yr of purchase — negotiate it off the price.'},
  {name:'Greece',   flag:'🇬🇷', buyPct:8,  sellPct:4,  schengen:true,  taxId:'AFM',
   note:'Transfer tax 3.09% on the higher of price or "objective value"; each side pays own agent (~2%+VAT). Individual CGT SUSPENDED to end-2026 — but 3+ sales within 2 yrs is taxed as business income. Title is the hazard: forest-map (dasika), archaeology and unregistered inheritance shares — never buy without lawyer + engineer. Even small works need an engineer to file the permit. Builder quotes often EXCLUDE 24% VAT.'},
  {name:'Bulgaria', flag:'🇧🇬', buyPct:7,  sellPct:4,  schengen:true,  taxId:'Foreigner number (ЛНЧ)',
   note:'Cheapest houses in the EU (Veliko Tarnovo wrecks from ~€4k). Catch: non-EU citizens (incl. Brits) cannot own LAND — a house with a garden is normally bought via a cheap Bulgarian company (EOOD, ~€300–600/yr accounting). CGT 10% flat. Transfer tax ~3% + notary + buyer-side agent ~3%. Fragmented inheritance title is common — full title check essential. Schengen since 2025, euro since 2026 — no longer a clock-stopper.'},
  {name:'Ireland',  flag:'🇮🇪', buyPct:3,  sellPct:3,  schengen:false, taxId:'PPS number',
   note:'NO Schengen clock — Common Travel Area lets British citizens (incl. Jersey) live & work indefinitely. Cheapest buy costs (1% stamp + solicitor). Vacant Property Refurbishment Grant: €50k (vacant 2+ yrs) / €70k (derelict) — BUT owner-occupancy required and a 10-yr clawback if you sell, so grant-funded flips don’t work; it’s a base-country play. Electrics/gas are strictly registered-trades-only (REC/RGI). CGT 33%; main-residence relief has an anti-flipping carve-out.'},
  {name:'Croatia',  flag:'🇭🇷', buyPct:8,  sellPct:5,  schengen:true,  taxId:'OIB',
   note:'Transfer tax 3% + agent ~3%+VAT. CGT exempt after 2 years held. Title can be messy (inheritance splits).'},
  {name:'Other',    flag:'🇪🇺', buyPct:9,  sellPct:5,  schengen:true,  taxId:'Local tax ID',
   note:'Edit the % costs to match — round-trip transaction costs in most of Europe run 10–18%.'},
];

const BUDGET_CATS = ['Purchase & fees','Materials','Trades / labour','Utilities & holding','Selling costs','Other'];

const DOC_TEMPLATE = [
  '{TAXID} obtained (both of us)',
  'Bank / Wise account ready for local payments',
  'Independent lawyer engaged (not the agent\u2019s)',
  'Title & land-registry check clean',
  'Cadastral record matches reality (no unregistered extensions)',
  'Builder / surveyor walk-through done before offer',
  'Utilities status confirmed (water, electricity, sewage/septic, access)',
  'Energy certificate seen / obtained',
  'Preliminary contract signed + deposit paid',
  'Completion at notary booked',
  'Property insurance active from day one',
  'Utilities transferred into our name',
  'Registered for local property tax',
  'Renovation permits applied for',
  'Renovation permits granted',
  'Habitability / occupancy certificate (if required)',
  'SALE: agent engaged & listing live',
  'SALE: energy certificate current for listing',
  'SALE: completion & tax filings done',
];

// Pre-trip skills curriculum. Status per person: 0 none, 1 learning, 2 practiced, 3 confident.
// r: [label, url] free resources — enriched from research; add your own via Add skill.
const SKILL_SEED = [
 // ---- Buying & Scouting ----
 {p:'Buying & Scouting', t:'Property portals & searching like a local', w:'Each country has its own dominant portal — learn the filters, set alerts, learn the abbreviations.', r:[['Idealista (ES/IT/PT)','https://www.idealista.com'],['Immobiliare.it','https://www.immobiliare.it'],['Green-Acres (rural EU)','https://www.green-acres.com']]},
 {p:'Buying & Scouting', t:'Valuing a property & running comps', w:'Price per m² of SOLD comparables, not asking prices. Know the ceiling value of the street before you offer.', r:[['Property Hub (YT)','https://www.youtube.com/PropertyHubUK'],['Move iQ — Phil Spencer (YT)','https://www.youtube.com/channel/UC9jtWjaSUE1A0_D-ge2fltA']]},
 {p:'Buying & Scouting', t:'Negotiation fundamentals', w:'Cheap rural markets are illiquid — sellers wait years. Big discounts are normal; learn to anchor low politely and justify with condition evidence.', r:[['Negotiation — Univ. of Michigan (free audit)','https://www.coursera.org/learn/negotiation-skills'],['Move iQ — offers & agents (YT)','https://www.youtube.com/channel/UC9jtWjaSUE1A0_D-ge2fltA']]},
 {p:'Buying & Scouting', t:'Country buying process & due diligence', w:'Notary systems, preliminary contracts, deposits, what your lawyer must check. Different in every country.', r:[['Spanish Property Insight guides','https://www.spanishpropertyinsight.com/guide-topic/buying/'],['FrenchEntrée — the notaire','https://www.frenchentree.com/french-property/role-of-the-notaire-in-france/'],['SPI (YT)','https://www.youtube.com/@SpanishPropertyInsight-SPI']]},
 {p:'Buying & Scouting', t:'Language survival + trades vocabulary', w:'Enough to greet, buy materials and talk to builders. "Leaking pipe" in the local language is worth more than small talk.', r:[['Duolingo','https://www.duolingo.com'],['Language Transfer (free audio)','https://www.languagetransfer.org']]},
 // ---- Assess & Survey ----
 {p:'Assess & Survey', t:'Reading a building: cracks & movement', w:'Which cracks are cosmetic and which mean subsidence — the difference between a bargain and a money pit. Diagonal/stepped cracks + sticking doors = get an engineer or walk.', r:[['5 signs of subsidence (YT)','https://www.youtube.com/watch?v=iNIjjarJLEM'],['SPAB knowledge base','https://www.spab.org.uk/advice/knowledge-base']]},
 {p:'Assess & Survey', t:'Damp: types, causes, spotting it', w:'Rising, penetrating, condensation. Old masonry has no damp course — find the moisture SOURCE first; most "rising damp" is a broken gutter or cement render trapping moisture.', r:[['Heritage House knowledge base','https://www.heritage-house.org/'],['Peter Ward / Heritage House (YT)','https://www.youtube.com/user/stibnite11/videos'],['Charlie DIYte (YT)','https://www.youtube.com/@CharlieDIYte/videos']]},
 {p:'Assess & Survey', t:'Roof inspection basics', w:'The single most expensive surprise. Tiles can look perfect while rafter ends buried in damp masonry are rotten — always inspect the loft with a torch and knife.', r:[['Skill Builder (YT)','https://www.youtube.com/@SkillBuilder'],['The Restoration Couple (YT)','https://www.youtube.com/@TheRestorationCouple']]},
 {p:'Assess & Survey', t:'Timber: rot & woodworm', w:'Poke the beams. Know dry rot vs wet rot vs old inactive worm holes.', r:[['SPAB knowledge base','https://www.spab.org.uk/advice/knowledge-base'],['SPAB Old House Project (YT)','https://www.youtube.com/channel/UC5yTb3yuUXWwVT3WMSCd9_A/videos']]},
 {p:'Assess & Survey', t:'Utilities & drainage assessment', w:'Is there LEGAL water, power, sewage, access? Connecting a rural ruin can cost €5–25k — get binding quotes from the network operator BEFORE buying.', r:[['Septic tanks explained (YT)','https://www.youtube.com/watch?v=AspaQBHc5jw'],['Ask This Old House — septic (YT)','https://www.youtube.com/watch?v=PUP8_IY-Sgs']]},
 {p:'Assess & Survey', t:'Quick renovation cost estimating', w:'€/m² rules of thumb per level of renovation so you can price a project standing in the doorway (benchmarks in PLAYBOOK.md).', r:[['Homebuilding & Renovating (YT)','https://www.youtube.com/channel/UCnBQs4X0ZLg5-aLailTGbsw'],['Budget a renovation line-by-line (YT)','https://www.youtube.com/watch?v=2ziZFXaWZT0']]},

// ---------- state ----------
let db = null;
let view = {tab:'dashboard', propId:null, propTab:'deal', skillFilter:'all'};

function freshDb(){
  return {version:1, people:['Me','Partner'], currency:'€',
    properties:[], stays:[],
    skills: SKILL_SEED.map(s=>({id:uid(), phase:s.p, title:s.t, why:s.w,
      resources:s.r.map(x=>({label:x[0],url:x[1]})), status:[0,0], custom:false }))};
}
// Repair/guard any loaded or imported data so a malformed backup can never
// crash a view or (worse) trigger a fresh-DB overwrite of good data.
function normalize(d){
  d.people = (d.people && d.people.length) ? d.people : ['Me','Partner'];
  d.properties = Array.isArray(d.properties) ? d.properties : [];
  d.skills = Array.isArray(d.skills) ? d.skills : [];
  d.stays = Array.isArray(d.stays) ? d.stays : [];
  d.currency = d.currency || '€';
  d.skills.forEach(s=>{
    if(!Array.isArray(s.status)) s.status = [];
    while(s.status.length < d.people.length) s.status.push(0);
    if(!Array.isArray(s.resources)) s.resources = [];
  });
  d.properties.forEach(p=>{
    p.dates = p.dates||{}; p.deal = p.deal||{};
    p.rooms = Array.isArray(p.rooms) ? p.rooms : [];
    p.rooms.forEach(r=>{ if(!Array.isArray(r.tasks)) r.tasks = []; });
    p.budget = Array.isArray(p.budget) ? p.budget : [];
    p.contacts = Array.isArray(p.contacts) ? p.contacts : [];
    p.docs = Array.isArray(p.docs) ? p.docs : [];
    p.journal = Array.isArray(p.journal) ? p.journal : [];
  });
  // adopt newly-shipped resource links for seed skills the user hasn't customised or cleared
  const seedByTitle = {}; SKILL_SEED.forEach(s=>seedByTitle[s.t]=s);
  d.skills.forEach(s=>{ const seed = seedByTitle[s.title];
    if(seed && !s.custom && !s.resourcesCleared && seed.r.length && s.resources.length===0)
      s.resources = seed.r.map(x=>({label:x[0], url:x[1]}));
  });
  return d;
}
let _rev = 0; // revision of the data this tab last loaded or saved
function stashCorrupt(raw){ try{ if(raw) localStorage.setItem(LS_KEY+'_corrupt', raw); }catch(e){} }
function load(){
  const raw = localStorage.getItem(LS_KEY);
  try{
    if(!raw){ _rev = 0; return freshDb(); }
    const d = JSON.parse(raw);
    if(!d || !d.version){ stashCorrupt(raw); _rev = 0; return freshDb(); }
    _rev = typeof d.rev==='number' ? d.rev : 0;
    return normalize(d);
  }catch(e){
    // never overwrite what we couldn't read — keep a copy for recovery
    console.error('load failed', e); stashCorrupt(raw); _rev = 0; return freshDb();
  }
}
function save(){
  // last-write-wins guard: if another tab saved since we loaded, refresh instead of clobbering it
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const stored = JSON.parse(raw);
      if(stored && typeof stored.rev==='number' && stored.rev > _rev){
        db = normalize(stored); _rev = stored.rev; render();
        alert('This page was out of date (changes were saved in another tab) — it has been refreshed. Please redo your last change.');
        return;
      } }
  }catch(e){}
  _rev += 1; db.rev = _rev;
  localStorage.setItem(LS_KEY, JSON.stringify(db));
}
function commit(){ save(); render(); }

// ---------- utils ----------
function uid(){ return Math.random().toString(36).slice(2,9)+Math.random().toString(36).slice(2,5); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function n(v){ const x = parseFloat(v); return isFinite(x)?x:0; }
function money(v, dec){ if(v==null||!isFinite(v)) return '—';
  return db.currency + Math.round(v).toLocaleString('en-GB'); }
function pct(v){ return isFinite(v)? (v*100).toFixed(0)+'%' : '—'; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pd(s){ return new Date(s+'T12:00:00'); } // parse date safely
function addDays(date, days){ const d=new Date(date); d.setDate(d.getDate()+days); return d; }
function fmtDate(s){ if(!s) return '—'; const d=pd(s); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function normUrl(u){ u=(u||'').trim(); return u && !/^[a-z][a-z0-9+.-]*:/i.test(u) ? 'https://'+u : u; } // "www.x.com" would otherwise resolve as a relative file:// link
function stageOf(p){ return STAGES.find(s=>s.id===p.stage)||STAGES[0]; }
function countryOf(p){ return COUNTRIES.find(c=>c.name===p.country)||COUNTRIES[COUNTRIES.length-1]; }
function prop(id){ return db.properties.find(p=>p.id===id); }
function chip(stage){ const [bg,fg]=STAGE_COLORS[stage.c]; return `<span class="chip" style="background:${bg};color:${fg}">${stage.label}</span>`; }

// ---------- money maths ----------
function propSpent(p){ // actuals: ledger + task actual costs
  const ledger = (p.budget||[]).reduce((a,b)=>a+n(b.actual),0);
  const tasks = (p.rooms||[]).flatMap(r=>r.tasks).reduce((a,t)=>a+n(t.actualCost),0);
  return {ledger, tasks, total: ledger+tasks};
}
function dealCalc(p){
  const d = p.deal||{};
  const price = n(d.purchasePrice)||n(d.askingPrice);
  const buyCosts = price*n(d.buyPct)/100;
  const reno = n(d.renoBudget);
  const hold = n(d.holdMonthly)*n(d.holdMonths);
  const allIn = price+buyCosts+reno+hold;
  const target = n(d.targetSale);
  const sellCosts = target*n(d.sellPct)/100;
  const profit = target? target-sellCosts-allIn : null;
  const roi = (profit!=null&&allIn>0)? profit/allIn : null;
  const breakeven = (allIn>0 && n(d.sellPct)<100)? allIn/(1-n(d.sellPct)/100) : null;
  const spent = propSpent(p);
  // realised (sold): everything actually paid should be in ledger/tasks; purchase price counted separately
  let realised = null;
  if(n(d.actualSale)>0){ realised = n(d.actualSale) - price - spent.total; }
  return {price, buyCosts, reno, hold, allIn, target, sellCosts, profit, roi, breakeven, spent, realised};
}
function taskStats(p){
  const ts=(p.rooms||[]).flatMap(r=>r.tasks);
  return {total:ts.length, done:ts.filter(t=>t.status==='done').length, doing:ts.filter(t=>t.status==='doing').length};
}

// ---------- Schengen 90/180 ----------
function stayDaysInWindow(stay, winStart, winEnd){
  const s = pd(stay.entry), e = stay.exit? pd(stay.exit) : pd(todayISO());
  const a = Math.max(s.getTime(), winStart.getTime());
  const b = Math.min(e.getTime(), winEnd.getTime());
  if(b<a) return 0;
  return Math.round((b-a)/86400000)+1; // inclusive of both days
}
// Collect each calendar day of a stay (clamped to the window) into a Set, so
// overlapping stays and same-day border crossings count each day exactly once.
function addStayDays(set, stay, winStart, winEnd, ongoingUntil){
  const s = pd(stay.entry), e = stay.exit ? pd(stay.exit) : (ongoingUntil || pd(todayISO()));
  const a = Math.max(s.getTime(), winStart.getTime());
  const b = Math.min(e.getTime(), winEnd.getTime());
  for(let t=a; t<=b; t+=86400000) set.add(Math.floor(t/86400000));
}
function schengenUsed(onDate){
  const winEnd = onDate ? (onDate instanceof Date ? pd(todayISO()) : pd(onDate)) : pd(todayISO());
  const winStart = addDays(winEnd,-179);
  const days = new Set();
  db.stays.filter(s=>s.schengen).forEach(s=>addStayDays(days, s, winStart, winEnd));
  return days.size;
}
function schengenProjection(){
  // if you were in / entered Schengen today, how long could you stay continuously?
  const today = pd(todayISO());
  const ongoing = db.stays.some(s=>s.schengen && !s.exit);
  let maxDay = -1;
  for(let d=0; d<120; d++){
    const day = addDays(today, d);
    const winStart = addDays(day,-179);
    const days = new Set();
    // ongoing stays are assumed to continue through the simulated day
    db.stays.filter(s=>s.schengen).forEach(s=>addStayDays(days, s, winStart, day, day));
    if(!ongoing) addStayDays(days, {entry:todayISO(), exit:null}, winStart, day, day); // virtual stay today..day
    if(days.size>90) break;
    maxDay = d;
  }
  return maxDay; // days including today; -1 = cannot enter today
}

// ---------- modal ----------
let modalCb = null;
function openModal(title, fields, onSave, opts){
  opts = opts||{};
  modalCb = onSave;
  const html = fields.map(f=>{
    if(f.type==='sep') return `<h3 style="margin-top:6px">${esc(f.label)}</h3>`;
    const val = f.value==null?'':f.value;
    let input='';
    if(f.type==='select'){
      input = `<select id="mf_${f.key}">${f.options.map(o=>{
        const [v,l] = Array.isArray(o)?o:[o,o];
        return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;
    } else if(f.type==='textarea'){
      input = `<textarea id="mf_${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
    } else if(f.type==='check'){
      input = `<label style="display:flex;gap:8px;align-items:center;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600"><input type="checkbox" id="mf_${f.key}" ${val?'checked':''} style="width:16px;height:16px;accent-color:var(--olive)"> ${esc(f.checkLabel||'Yes')}</label>`;
    } else {
      input = `<input id="mf_${f.key}" type="${f.type||'text'}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}" ${f.type==='number'?'step="any" inputmode="decimal"':''}>`;
    }
    const field = `<div class="field"><label>${esc(f.label)}</label>${input}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
    return f.half ? field.replace('<div class="field">','<div class="field" data-half="1">') : field;
  });
  // pair up half-width fields
  let body='', i=0;
  while(i<html.length){
    if(html[i].includes('data-half') && html[i+1] && html[i+1].includes('data-half')){
      body += `<div class="fields-2">${html[i]}${html[i+1]}</div>`; i+=2;
    } else { body += html[i]; i++; }
  }
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onmousedown="window._bgDown=(event.target===this)" onclick="if(event.target===this&&window._bgDown)requestCloseModal()">
      <div class="modal">
        <h3>${esc(title)}</h3>
        <form id="modal-form" onsubmit="submitModal(event)">${body}
          <div class="actions">
            ${opts.deleteLabel?`<button type="button" class="btn danger ghost" style="margin-right:auto" onclick="modalDelete()">${esc(opts.deleteLabel)}</button>`:''}
            <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn primary">${esc(opts.saveLabel||'Save')}</button>
          </div>
        </form>
      </div>
    </div>`;
  window._modalFields = fields; window._modalDelete = opts.onDelete||null;
  // snapshot initial control values for the dirty check
  window._modalInit = {};
  fields.forEach(f=>{ if(f.type==='sep') return;
    const el=document.getElementById('mf_'+f.key);
    if(el) window._modalInit[f.key] = f.type==='check' ? el.checked : el.value;
  });
  document.body.style.overflow='hidden';
  const first = document.querySelector('#modal-form input,#modal-form select,#modal-form textarea');
  if(first) first.focus();
}
function submitModal(e){
  e.preventDefault();
  const vals={};
  window._modalFields.forEach(f=>{
    if(f.type==='sep') return;
    const el=document.getElementById('mf_'+f.key);
    if(!el) return;
    vals[f.key] = f.type==='check'? el.checked : el.value.trim();
  });
  // run the save first: callbacks return false on validation failure,
  // which keeps the form (and everything typed into it) on screen
  const ok = modalCb ? modalCb(vals) : true;
  if(ok!==false) closeModal();
}
function modalDirty(){
  if(!window._modalFields || !window._modalInit || !document.getElementById('modal-form')) return false;
  return window._modalFields.some(f=>{
    if(f.type==='sep') return false;
    const el=document.getElementById('mf_'+f.key);
    if(!el || !(f.key in window._modalInit)) return false;
    const cur = f.type==='check' ? el.checked : el.value;
    return cur !== window._modalInit[f.key];
  });
}
function requestCloseModal(){
  if(!document.getElementById('modal-form')) return;
  if(modalDirty() && !confirm('Discard unsaved changes?')) return;
  closeModal();
}
function modalDelete(){
  if(!window._modalDelete){ closeModal(); return; }
  // onDelete returns false when its confirm() was cancelled — keep the modal
  if(window._modalDelete()!==false) closeModal();
}
function closeModal(){
  document.getElementById('modal-root').innerHTML='';
  document.body.style.overflow='';
  if(window._staleDb){ window._staleDb=false; db=load(); render(); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') requestCloseModal(); });

// ---------- dashboard ----------
function vDashboard(){
  const active = db.properties.filter(p=>!['sold','dropped'].includes(p.stage));
  const owned = db.properties.filter(p=>['renovating','selling','sold'].includes(p.stage)||p.stage==='buying');
  let cashIn=0, projected=0, realised=0;
  db.properties.forEach(p=>{
    const c=dealCalc(p);
    if(['buying','renovating','selling'].includes(p.stage)) cashIn += c.price + c.spent.total;
    if(['buying','renovating','selling'].includes(p.stage) && c.profit!=null) projected += c.profit;
    if(p.stage==='sold' && c.realised!=null) realised += c.realised;
  });
  const confident = db.skills.reduce((a,s)=>a+s.status.filter(x=>x>=3).length,0);
  const totalSkillSlots = db.skills.length*db.people.length;
  const used = schengenUsed(new Date());
  const alerts=[];
  db.properties.forEach(p=>{
    if(['renovating','selling'].includes(p.stage)){
      const c=dealCalc(p);
      if(c.reno>0 && c.spent.total > c.reno) alerts.push(`<div class="alert red">🔥 <b>${esc(p.name)}</b> renovation spend ${money(c.spent.total)} is over the ${money(c.reno)} budget.</div>`);
      if(!c.target) alerts.push(`<div class="alert">🎯 <b>${esc(p.name)}</b> has no target sale price — set one in the Deal tab to see projected profit.</div>`);
    }
  });
  if(used>75) alerts.push(`<div class="alert red">🛂 Schengen: ${used}/90 days used in the current 180-day window — plan an exit.</div>`);

  return `
  <h1>Dashboard</h1>
  <div class="sub">The whole journey at a glance.</div>
  ${alerts.join('')}
  <div class="cards">
    <div class="stat"><div class="k">Active projects</div><div class="v">${active.length}</div><div class="d">${db.properties.length} tracked in total</div></div>
    <div class="stat"><div class="k">Cash in projects</div><div class="v">${money(cashIn)}</div><div class="d">purchase + spend on live projects</div></div>
    <div class="stat"><div class="k">Projected profit</div><div class="v ${projected>=0?'pos':'neg'}">${money(projected)}</div><div class="d">live projects with a target price</div></div>
    <div class="stat"><div class="k">Realised profit</div><div class="v ${realised>=0?'pos':'neg'}">${money(realised)}</div><div class="d">from sold projects</div></div>
    <div class="stat"><div class="k">Skills confident</div><div class="v">${confident}<span style="font-size:14px;color:var(--muted)">/${totalSkillSlots}</span></div><div class="d">across ${db.people.map(esc).join(' & ')}</div></div>
    <div class="stat"><div class="k">Schengen days</div><div class="v ${used>75?'neg':used>60?'mid':''}">${used}<span style="font-size:14px;color:var(--muted)">/90</span></div><div class="d">used in last 180 days</div></div>
  </div>
  <h2>Projects</h2>
  ${db.properties.length===0 ? `<div class="panel empty"><div class="big">🏚️</div>No properties yet.<br><br><button class="btn primary" onclick="addProperty()">+ Add your first property</button> <button class="btn" onclick="loadDemo()">Load example</button></div>`
    : `<div class="prop-grid">${db.properties.map(propCard).join('')}</div>
       <div style="margin-top:14px"><button class="btn primary" onclick="addProperty()">+ Add property</button></div>`}
  `;
}

const SKILL_PHASES=['Buying & Scouting','Assess & Survey','Core DIY','Systems Awareness','Finishing Trades','Project & Sale'];

function vSkills(){
  const filter=view.skillFilter;
  return `

    <button class="${filter==='all'?'on':''}" onclick="view.skillFilter='all';render()">All</button>

  </div>
  ${SKILL_PHASES.filter(ph=>filter==='all'||filter===ph).map(ph=>{
    const skills=db.skills.filter(s=>s.phase===ph);
    if(!skills.length) return '';
    const slots=skills.length*db.people.length;
    const score=skills.reduce((a,s)=>a+s.status.reduce((x,y)=>x+y,0),0);
    const prog=slots?Math.round(score/(slots*3)*100):0;
    return `<div class="phasehead"><h2>${ph}</h2><div class="bar grow" style="max-width:130px"><i style="width:${prog}%"></i></div><span class="small">${prog}%</span></div>

        <div class="grow">
          <div class="row"><b>${esc(s.title)}</b><button class="iconbtn right" onclick="editSkill('${s.id}')">✏️</button></div>
          <div class="small">${esc(s.why||'')}</div>
          ${(s.resources&&s.resources.length)?`<div class="skill-links">${s.resources.map(r=>`<a href="${esc(normUrl(r.url))}" target="_blank" rel="noopener">▶ ${esc(r.label)}</a>`).join('')}</div>`:''}
        </div>
      </div>`).join('')}
    </div>`;
  }).join('')}
  <div style="margin-top:14px"><button class="btn primary" onclick="addSkill()">+ Add custom skill</button></div>

}
function cycleSkill(sid,pi){ const s=db.skills.find(x=>x.id===sid); s.status[pi]=(s.status[pi]+1)%4; commit(); }
function skillFields(s){ s=s||{};
  return [
    {key:'title',label:'Skill',value:s.title},
    {key:'phase',label:'Phase',type:'select',options:SKILL_PHASES,value:s.phase||'Core DIY'},
    {key:'why',label:'Why it matters',type:'textarea',value:s.why},

    {key:'r1u',label:'Resource 1 — URL',value:s.resources&&s.resources[0]?s.resources[0].url:'',half:true},
    {key:'r2l',label:'Resource 2 — label',value:s.resources&&s.resources[1]?s.resources[1].label:'',half:true},
    {key:'r2u',label:'Resource 2 — URL',value:s.resources&&s.resources[1]?s.resources[1].url:'',half:true},
  ];}
function skillFromVals(v, s){
  const resources=[];
  if(v.r1u) resources.push({label:v.r1l||'Resource',url:normUrl(v.r1u)});
  if(v.r2u) resources.push({label:v.r2l||'Resource',url:normUrl(v.r2u)});
  // keep any extra resources beyond the 2 editable slots
  if(s && s.resources && s.resources.length>2) resources.push(...s.resources.slice(2));
  return resources;
}
function addSkill(){
  openModal('Add skill', skillFields(), v=>{

    db.skills.push({id:uid(),phase:v.phase,title:v.title,why:v.why,resources:skillFromVals(v),status:db.people.map(()=>0),custom:true}); commit();
  });

function editSkill(sid){
  const s=db.skills.find(x=>x.id===sid);
  openModal('Edit skill', skillFields(s), v=>{

}

function renamePerson(i){
  openModal('Rename person',[{key:'name',label:'Name',value:db.people[i]}],v=>{

    if(v.name && v.name!==old){
      db.people[i]=v.name;
      // tasks store the assignee by name — carry assignments across the rename
      db.properties.forEach(p=>(p.rooms||[]).forEach(r=>r.tasks.forEach(t=>{ if(t.who===old) t.who=v.name; })));
    }

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`handymanplan-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d||!d.version||!Array.isArray(d.properties)) throw new Error('Not a HandymanPlan backup');
      if(confirm('Replace ALL current data with this backup?')){ db=normalize(d); commit(); }
    }catch(e){ alert('Import failed: '+e.message); }
    input.value='';
  };
  reader.readAsText(f);
}
