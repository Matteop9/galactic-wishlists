<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SkyDex rarity stamps">
  <defs>
    <style>
      .arc{font-family:"IBM Plex Mono","Consolas",monospace;font-weight:600;letter-spacing:0.14em;}
      .lbl{font-family:"Saira Condensed","Oswald",sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;}
      .hex{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.06em;}
    </style>
    <!-- plane glyph reused across all tiers -->
    <g id="plane">
      <path d="M 0,-12 L 2,-2 L 15,5 L 15,8 L 2,5 L 1.5,11 L 4.5,14 L 4.5,16 L 0,14.5 L -4.5,16 L -4.5,14 L -1.5,11 L -2,5 L -15,8 L -15,5 L -2,-2 Z"/>
    </g>
  </defs>
  <rect width="900" height="240" fill="#F2EBDC"/>

  <!-- ============ COMMON (white/grey) — single plain ring ============ -->
  <g transform="translate(90,96)">
    <circle r="44" fill="none" stroke="#6E7A6A" stroke-width="3"/>
    <path id="c-top" d="M -30,-3 A 30 30 0 0 1 30,-3" fill="none"/>
    <text class="arc" fill="#6E7A6A" font-size="8"><textPath href="#c-top" startOffset="50%" text-anchor="middle">COMMON</textPath></text>
    <use href="#plane" fill="#6E7A6A" transform="rotate(20) scale(1.05)"/>
  </g>
  <text class="lbl" x="90" y="172" font-size="15" fill="#6E7A6A" text-anchor="middle">Common</text>
  <text class="hex" x="90" y="188" fill="#8A9396" text-anchor="middle">#6E7A6A</text>

  <!-- ============ UNCOMMON (green) — double ring + base ticks ============ -->
  <g transform="translate(258,96)">
    <circle r="44" fill="none" stroke="#3E7A5A" stroke-width="3"/>
    <circle r="37" fill="none" stroke="#3E7A5A" stroke-width="1.2"/>
    <path id="u-top" d="M -31,-3 A 31 31 0 0 1 31,-3" fill="none"/>
    <text class="arc" fill="#3E7A5A" font-size="8"><textPath href="#u-top" startOffset="50%" text-anchor="middle">UNCOMMON</textPath></text>
    <!-- base tick row -->
    <g stroke="#3E7A5A" stroke-width="1.4">
      <line x1="-12" y1="30" x2="-12" y2="35"/><line x1="0" y1="31" x2="0" y2="36"/><line x1="12" y1="30" x2="12" y2="35"/>
    </g>
    <use href="#plane" fill="#3E7A5A" transform="rotate(20) scale(1.05)"/>
  </g>
  <text class="lbl" x="258" y="172" font-size="15" fill="#3E7A5A" text-anchor="middle">Uncommon</text>
  <text class="hex" x="258" y="188" fill="#8A9396" text-anchor="middle">#3E7A5A</text>

  <!-- ============ RARE (blue) — double ring + dashed inner + 2 stars ============ -->
  <g transform="translate(426,96)">
    <circle r="45" fill="none" stroke="#2E5E86" stroke-width="3"/>
    <circle r="38" fill="none" stroke="#2E5E86" stroke-width="1.2"/>
    <circle r="33" fill="none" stroke="#2E5E86" stroke-width="0.9" stroke-dasharray="1.5 3"/>
    <path id="r-top" d="M -32,-3 A 32 32 0 0 1 32,-3" fill="none"/>
    <text class="arc" fill="#2E5E86" font-size="8"><textPath href="#r-top" startOffset="50%" text-anchor="middle">RARE</textPath></text>
    <!-- flanking stars -->
    <path d="M -40,2 l1.2,3.6 l3.8,0 l-3,2.3 l1.1,3.6 l-3.1,-2.2 l-3.1,2.2 l1.1,-3.6 l-3,-2.3 l3.8,0 z" fill="#2E5E86" transform="translate(2,0)"/>
    <path d="M 36,2 l1.2,3.6 l3.8,0 l-3,2.3 l1.1,3.6 l-3.1,-2.2 l-3.1,2.2 l1.1,-3.6 l-3,-2.3 l3.8,0 z" fill="#2E5E86"/>
    <use href="#plane" fill="#2E5E86" transform="rotate(20) scale(1.05)"/>
  </g>
  <text class="lbl" x="426" y="172" font-size="15" fill="#2E5E86" text-anchor="middle">Rare</text>
  <text class="hex" x="426" y="188" fill="#8A9396" text-anchor="middle">#2E5E86</text>

  <!-- ============ EPIC (purple) — scalloped outer + laurels + 3 stars ============ -->
  <g transform="translate(594,96)">
    <!-- scalloped outer ring -->
    <g fill="none" stroke="#6A3E86" stroke-width="2.4">
      <circle r="44"/>
    </g>
    <!-- scallop dots ring outside -->
    <g fill="#6A3E86">
      <!-- 16 little bumps -->
      <circle cx="47.0" cy="0.0" r="2.1"/><circle cx="43.4" cy="18.0" r="2.1"/><circle cx="33.2" cy="33.2" r="2.1"/><circle cx="18.0" cy="43.4" r="2.1"/><circle cx="0.0" cy="47.0" r="2.1"/><circle cx="-18.0" cy="43.4" r="2.1"/><circle cx="-33.2" cy="33.2" r="2.1"/><circle cx="-43.4" cy="18.0" r="2.1"/><circle cx="-47.0" cy="0.0" r="2.1"/><circle cx="-43.4" cy="-18.0" r="2.1"/><circle cx="-33.2" cy="-33.2" r="2.1"/><circle cx="-18.0" cy="-43.4" r="2.1"/><circle cx="-0.0" cy="-47.0" r="2.1"/><circle cx="18.0" cy="-43.4" r="2.1"/><circle cx="33.2" cy="-33.2" r="2.1"/><circle cx="43.4" cy="-18.0" r="2.1"/>
    </g>
    <circle r="40" fill="none" stroke="#6A3E86" stroke-width="1.4"/>
    <circle r="34" fill="none" stroke="#6A3E86" stroke-width="0.9" stroke-dasharray="1.5 3"/>
    <path id="e-top" d="M -34,-4 A 34 34 0 0 1 34,-4" fill="none"/>
    <text class="arc" fill="#6A3E86" font-size="8"><textPath href="#e-top" startOffset="50%" text-anchor="middle">EPIC</textPath></text>
    <!-- laurel sprigs -->
    <g stroke="#6A3E86" stroke-width="1.3" fill="none">
      <path d="M -30,20 q -6,4 -7,12"/><path d="M -32,24 q -4,0 -6,3"/><path d="M -34,28 q -3,1 -4,4"/>
      <path d="M 30,20 q 6,4 7,12"/><path d="M 32,24 q 4,0 6,3"/><path d="M 34,28 q 3,1 4,4"/>
    </g>
    <!-- 3 stars -->
    <g fill="#6A3E86">
      <path d="M 0,30 l1.1,3.3 l3.5,0 l-2.8,2.1 l1,3.3 l-2.8,-2 l-2.8,2 l1,-3.3 l-2.8,-2.1 l3.5,0 z"/>
      <path d="M -13,29 l0.9,2.7 l2.9,0 l-2.3,1.7 l0.85,2.7 l-2.35,-1.65 l-2.35,1.65 l0.85,-2.7 l-2.3,-1.7 l2.9,0 z"/>
      <path d="M 13,29 l0.9,2.7 l2.9,0 l-2.3,1.7 l0.85,2.7 l-2.35,-1.65 l-2.35,1.65 l0.85,-2.7 l-2.3,-1.7 l2.9,0 z"/>
    </g>
    <use href="#plane" fill="#6A3E86" transform="rotate(20) scale(1.1)"/>
  </g>
  <text class="lbl" x="594" y="172" font-size="15" fill="#6A3E86" text-anchor="middle">Epic</text>
  <text class="hex" x="594" y="188" fill="#8A9396" text-anchor="middle">#6A3E86</text>

  <!-- ============ LEGENDARY (orange/brass) — rosette + rays + wreath + crown ticks ============ -->
  <g transform="translate(786,96)">
    <!-- sunburst rays -->
    <g stroke="#B98A2E" stroke-width="1.2">
      <line x1="50.0" y1="0.0" x2="57.0" y2="0.0"/><line x1="48.3" y1="12.9" x2="55.1" y2="14.8"/><line x1="43.3" y1="25.0" x2="49.4" y2="28.5"/><line x1="35.4" y1="35.4" x2="40.3" y2="40.3"/><line x1="25.0" y1="43.3" x2="28.5" y2="49.4"/><line x1="12.9" y1="48.3" x2="14.8" y2="55.1"/><line x1="0.0" y1="50.0" x2="0.0" y2="57.0"/><line x1="-12.9" y1="48.3" x2="-14.8" y2="55.1"/><line x1="-25.0" y1="43.3" x2="-28.5" y2="49.4"/><line x1="-35.4" y1="35.4" x2="-40.3" y2="40.3"/><line x1="-43.3" y1="25.0" x2="-49.4" y2="28.5"/><line x1="-48.3" y1="12.9" x2="-55.1" y2="14.8"/><line x1="-50.0" y1="0.0" x2="-57.0" y2="0.0"/><line x1="-48.3" y1="-12.9" x2="-55.1" y2="-14.8"/><line x1="-43.3" y1="-25.0" x2="-49.4" y2="-28.5"/><line x1="-35.4" y1="-35.4" x2="-40.3" y2="-40.3"/><line x1="-25.0" y1="-43.3" x2="-28.5" y2="-49.4"/><line x1="-12.9" y1="-48.3" x2="-14.8" y2="-55.1"/><line x1="-0.0" y1="-50.0" x2="-0.0" y2="-57.0"/><line x1="12.9" y1="-48.3" x2="14.8" y2="-55.1"/><line x1="25.0" y1="-43.3" x2="28.5" y2="-49.4"/><line x1="35.4" y1="-35.4" x2="40.3" y2="-40.3"/><line x1="43.3" y1="-25.0" x2="49.4" y2="-28.5"/><line x1="48.3" y1="-12.9" x2="55.1" y2="-14.8"/>
    </g>
    <circle r="50" fill="none" stroke="#B98A2E" stroke-width="3"/>
    <circle r="44" fill="none" stroke="#B98A2E" stroke-width="1.4"/>
    <!-- guilloche-ish rosette -->
    <g fill="none" stroke="#B98A2E" stroke-width="0.7" opacity="0.85">
      <circle r="38"/><circle r="34"/>
    </g>
    <circle r="30" fill="none" stroke="#B98A2E" stroke-width="0.9" stroke-dasharray="1 2.5"/>
    <path id="l-top" d="M -36,-5 A 36 36 0 0 1 36,-5" fill="none"/>
    <text class="arc" fill="#B98A2E" font-size="8"><textPath href="#l-top" startOffset="50%" text-anchor="middle">LEGENDARY</textPath></text>
    <!-- full laurel wreath -->
    <g stroke="#B98A2E" stroke-width="1.3" fill="none">
      <path d="M -28,18 q -8,6 -9,16"/><path d="M -30,22 q -5,1 -7,5"/><path d="M -33,27 q -4,1 -5,5"/>
      <path d="M 28,18 q 8,6 9,16"/><path d="M 30,22 q 5,1 7,5"/><path d="M 33,27 q 4,1 5,5"/>
    </g>
    <!-- crown of 5 stars across top -->
    <g fill="#B98A2E">
      <path d="M 0,-30 l1.3,3.9 l4.1,0 l-3.3,2.4 l1.25,3.9 l-3.35,-2.4 l-3.35,2.4 l1.25,-3.9 l-3.3,-2.4 l4.1,0 z"/>
      <path d="M -15,-26 l1,3 l3.2,0 l-2.6,1.9 l1,3 l-2.6,-1.85 l-2.6,1.85 l1,-3 l-2.6,-1.9 l3.2,0 z"/>
      <path d="M 15,-26 l1,3 l3.2,0 l-2.6,1.9 l1,3 l-2.6,-1.85 l-2.6,1.85 l1,-3 l-2.6,-1.9 l3.2,0 z"/>
    </g>
    <use href="#plane" fill="#8A6A1E" transform="rotate(20) scale(1.15)"/>
  </g>
  <text class="lbl" x="786" y="180" font-size="15" fill="#B98A2E" text-anchor="middle">Legendary</text>
  <text class="hex" x="786" y="196" fill="#8A9396" text-anchor="middle">#B98A2E</text>
</svg>
