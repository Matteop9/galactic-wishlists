<svg width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SkyDex button system">
  <defs>
    <style>
      .lbl{font-family:"IBM Plex Mono","Consolas",monospace;font-size:10px;letter-spacing:0.12em;fill:#8A9396;}
      .btn{font-family:"Saira Condensed","Oswald",sans-serif;font-weight:600;letter-spacing:0.04em;}
      .btnsm{font-family:"Saira Condensed","Oswald",sans-serif;font-weight:600;letter-spacing:0.06em;}
    </style>
  </defs>
  <rect width="640" height="520" fill="#F2EBDC"/>

  <!-- ===== PRIMARY: CAPTURE ===== -->
  <text class="lbl" x="40" y="44">PRIMARY — CAPTURE  ·  the hero action, a verified real photo</text>
  <rect x="40" y="56" width="220" height="52" rx="8" fill="#0E7C86"/>
  <circle cx="74" cy="82" r="11" fill="none" stroke="#F2EBDC" stroke-width="2"/>
  <circle cx="74" cy="82" r="4" fill="#F2EBDC"/>
  <text class="btn" x="96" y="89" font-size="20" fill="#F2EBDC">CAPTURE AIRCRAFT</text>
  <!-- pressed -->
  <rect x="280" y="56" width="220" height="52" rx="8" fill="#0A5D64"/>
  <circle cx="314" cy="82" r="11" fill="none" stroke="#CDE5E6" stroke-width="2"/>
  <circle cx="314" cy="82" r="4" fill="#CDE5E6"/>
  <text class="btn" x="336" y="89" font-size="20" fill="#CDE5E6">CAPTURE AIRCRAFT</text>
  <text class="lbl" x="520" y="86" font-size="9">→ pressed</text>

  <!-- ===== SECONDARY: LOG ===== -->
  <text class="lbl" x="40" y="148">SECONDARY — LOG  ·  the casual, low-value catch from the map</text>
  <rect x="40" y="160" width="200" height="52" rx="8" fill="none" stroke="#0E7C86" stroke-width="1.8"/>
  <text class="btnsm" x="68" y="193" font-size="19" fill="#0E7C86">LOG FROM MAP</text>
  <!-- hover -->
  <rect x="262" y="160" width="200" height="52" rx="8" fill="#CDE5E6" stroke="#0E7C86" stroke-width="1.8"/>
  <text class="btnsm" x="290" y="193" font-size="19" fill="#0A5D64">LOG FROM MAP</text>
  <text class="lbl" x="482" y="190" font-size="9">→ hover</text>

  <!-- ===== CONFIRMED STATE ===== -->
  <text class="lbl" x="40" y="252">CONFIRMED — the verified-sighting state (success)</text>
  <rect x="40" y="264" width="240" height="52" rx="8" fill="#B5402E"/>
  <!-- tiny stamp tick -->
  <circle cx="72" cy="290" r="13" fill="none" stroke="#F2EBDC" stroke-width="1.6"/>
  <path d="M 66,290 l 4,4 l 8,-9" fill="none" stroke="#F2EBDC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="btn" x="94" y="297" font-size="20" fill="#F2EBDC">SIGHTING VERIFIED</text>

  <!-- ===== TERTIARY / QUIET ===== -->
  <text class="lbl" x="40" y="356">TERTIARY — quiet text action</text>
  <text class="btnsm" x="40" y="392" font-size="18" fill="#4A5560">View in scrapbook</text>
  <line x1="40" y1="400" x2="195" y2="400" stroke="#4A5560" stroke-width="1" stroke-dasharray="1 3"/>

  <!-- ===== DISABLED ===== -->
  <text class="lbl" x="320" y="356">DISABLED — out of range</text>
  <rect x="320" y="368" width="240" height="52" rx="8" fill="#E7DCC6"/>
  <text class="btn" x="348" y="401" font-size="20" fill="#8A9396">NO AIRCRAFT IN RANGE</text>

  <!-- ===== PILL / FILTER ===== -->
  <text class="lbl" x="40" y="456">PILLS — book filters &amp; rarity tags</text>
  <rect x="40" y="468" width="92" height="32" rx="16" fill="#20262B"/>
  <text class="btnsm" x="58" y="489" font-size="14" fill="#F2EBDC">AIRLINES</text>
  <rect x="142" y="468" width="78" height="32" rx="16" fill="none" stroke="#D8C9A8" stroke-width="1.5"/>
  <text class="btnsm" x="160" y="489" font-size="14" fill="#4A5560">TYPES</text>
  <rect x="230" y="468" width="120" height="32" rx="16" fill="#EBDCB6" stroke="#B98A2E" stroke-width="1.5"/>
  <circle cx="248" cy="484" r="4" fill="#B98A2E"/>
  <text class="btnsm" x="260" y="489" font-size="14" fill="#8A6A1E">LEGENDARY</text>
</svg>
