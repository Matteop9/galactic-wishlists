<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SkyDex rare stamp">
<defs>
    <style>
      .arc{font-family:"IBM Plex Mono","Consolas",monospace;font-weight:600;letter-spacing:0.14em;}
      .lbl{font-family:"Saira Condensed","Oswald",sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;}
      .hex{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.06em;}
    </style>
    <!-- plane glyph reused across all tiers -->
    <g id="plane">
      <path d="M 0,-12 L 2,-2 L 15,5 L 15,8 L 2,5 L 1.5,11 L 4.5,14 L 4.5,16 L 0,14.5 L -4.5,16 L -4.5,14 L -1.5,11 L -2,5 L -15,8 L -15,5 L -2,-2 Z"/>
    </g>
  </defs>
<g transform="translate(60,60)">
    <circle r="45" fill="none" stroke="#2E5E86" stroke-width="3"/>
    <circle r="38" fill="none" stroke="#2E5E86" stroke-width="1.2"/>
    <circle r="33" fill="none" stroke="#2E5E86" stroke-width="0.9" stroke-dasharray="1.5 3"/>
    <path id="r-top" d="M -32,-3 A 32 32 0 0 1 32,-3" fill="none"/>
    <text class="arc" fill="#2E5E86" font-size="8"><textPath href="#r-top" startOffset="50%" text-anchor="middle">RARE</textPath></text>
    <!-- flanking stars -->
    <path d="M -40,2 l1.2,3.6 l3.8,0 l-3,2.3 l1.1,3.6 l-3.1,-2.2 l-3.1,2.2 l1.1,-3.6 l-3,-2.3 l3.8,0 z" fill="#2E5E86" transform="translate(2,0)"/>
    <path d="M 36,2 l1.2,3.6 l3.8,0 l-3,2.3 l1.1,3.6 l-3.1,-2.2 l-3.1,2.2 l1.1,-3.6 l-3,-2.3 l3.8,0 z" fill="#2E5E86"/>
    <use href="#plane" fill="#2E5E86" transform="rotate(20) scale(1.05)"/>
  </g>
</svg>